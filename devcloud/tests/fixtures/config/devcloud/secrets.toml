# The stand-in secrets map; the fake Secret Manager holds made-up values.

[[secret]]
name = "gh-token"
store = "GH_TOKEN"
file = "~/.config/gh/hosts.yml"
template = """github.com:
    oauth_token: {value}
    user: devcloud-test
    git_protocol: https
"""

[[secret]]
name = "api-key"
env = "EXAMPLE_API_KEY"

[[secret]]
name = "pgpass"
file = "~/.pgpass"
