<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Ledger</title>
<!-- The session manager's ledger, read-only (served by `manager serve`). Design law: DESIGN.md beside this file.
     Every piece of ledger text is set with textContent; nothing on the page sends anything. -->
<style>
:root {
  --ground: oklch(0.975 0.010 160);
  --ink: oklch(0.26 0.020 160);
  --ink-muted: oklch(0.47 0.020 160);
  --rule: oklch(0.26 0.020 160 / 0.14);
  --rule-strong: oklch(0.26 0.020 160 / 0.32);
  --red: oklch(0.50 0.150 27);
  --red-ground: oklch(0.50 0.150 27 / 0.08);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, ui-serif, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --text: 17px; --small: 15px; --meta: 12.5px; --h-group: 19px; --h-init: 26px;
  --margin: 4.5rem;
  --column: 40rem;
  --radius: 2px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: oklch(0.19 0.012 160);
    --ink: oklch(0.92 0.010 160);
    --ink-muted: oklch(0.70 0.015 160);
    --rule: oklch(0.92 0.010 160 / 0.14);
    --rule-strong: oklch(0.92 0.010 160 / 0.32);
    --red: oklch(0.72 0.140 27);
    --red-ground: oklch(0.72 0.140 27 / 0.12);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: var(--text)/1.45 var(--serif);
  padding: max(var(--s5), env(safe-area-inset-top)) max(var(--s4), env(safe-area-inset-right))
           max(var(--s7), env(safe-area-inset-bottom)) max(var(--s4), env(safe-area-inset-left));
}
main { max-width: var(--column); margin: 0 auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: var(--radius); }
.mono, .margin, .meta, .stamp, .count, .fresh, .window, .refs, dt {
  font-family: var(--mono); font-size: var(--meta); font-variant-numeric: tabular-nums; line-height: 1.5;
}
h1, h2, h3, h4 { font-weight: 600; margin: 0; }

header { padding-bottom: var(--s4); border-bottom: 1px solid var(--rule-strong); }
h1 { font-size: var(--h-init); line-height: 1.2; }
.fresh, .window { margin: var(--s1) 0 0; color: var(--ink-muted); }
.fresh .conn { white-space: nowrap; }
.summary { list-style: none; margin: var(--s3) 0 0; padding: 0; }
.summary li { display: flex; flex-wrap: wrap; gap: 0 var(--s2); align-items: baseline; padding: var(--s1) 0; }
.summary a { font-weight: 600; }
.summary .count { color: var(--ink-muted); }
.summary .count.blocking { color: var(--red); }

.initiative { padding-top: var(--s6); }
.initiative > h2 { font-size: var(--h-init); line-height: 1.2; padding-bottom: var(--s2); }
.part { padding-top: var(--s5); }
.part > h3 { font-size: var(--h-group); display: flex; gap: var(--s2); align-items: baseline;
  padding-bottom: var(--s2); border-bottom: 1px solid var(--rule-strong); }
.part > h3 .count, .group > h4 .count { color: var(--ink-muted); font-weight: 400; }
.group > h4 { font-size: var(--small); padding: var(--s3) 0 var(--s1); display: flex; gap: var(--s2);
  align-items: baseline; }
.group > h4 .why { font-weight: 400; color: var(--ink-muted); font-style: italic; }
.group.blocking { border-bottom: 3px double var(--red); padding-bottom: var(--s1); }
.empty { color: var(--ink-muted); font-style: italic; margin: var(--s3) 0 0; }

details.item { border-bottom: 1px solid var(--rule); }
details.item > summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: var(--margin) 1fr auto;
  gap: 0 var(--s3); padding: var(--s3) 0; align-items: start;
}
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::after {
  content: "\203A"; font-family: var(--mono); color: var(--ink-muted); line-height: 1.45;
  transition: none; display: inline-block;
}
details.item[open] > summary::after { transform: rotate(90deg); }
.margin { color: var(--ink-muted); display: flex; flex-direction: column; padding-top: 0.15em; }
.margin .type { color: var(--ink); }
.body { min-width: 0; }
.need, .meaning, .refs { display: block; }
.need { overflow-wrap: anywhere; }
.meaning { color: var(--ink-muted); font-size: var(--small); margin-top: var(--s1); }
.meta { color: var(--ink-muted); margin-top: var(--s1); display: flex; flex-wrap: wrap; gap: 0 var(--s2);
  align-items: baseline; }
.meta .mark { color: var(--ink); }
.stamp { border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 0 var(--s1); color: var(--ink-muted); }
.stamp.blocking { border-color: var(--red); color: var(--red); background: var(--red-ground); }
.refs { color: var(--ink-muted); margin-top: var(--s1); overflow-wrap: anywhere; }
.more { padding: 0 0 var(--s4) calc(var(--margin) + var(--s3)); }
.more p { margin: 0 0 var(--s2); }
.more .label { font-family: var(--mono); font-size: var(--meta); color: var(--ink-muted); }
blockquote { margin: 0 0 var(--s3); font-style: italic; overflow-wrap: anywhere; }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: var(--s1) var(--s3); }
dt { color: var(--ink-muted); }
dd { margin: 0; font-size: var(--small); overflow-wrap: anywhere; }

details.item.row > summary { padding: var(--s2) 0; }
details.item.row .need { font-size: var(--small); }
details.item.row .meta { margin-top: 0; }

details.fold { margin-top: var(--s2); }
details.fold > summary { cursor: pointer; padding: var(--s2) 0; color: var(--ink-muted); font-family: var(--mono);
  font-size: var(--meta); }
.brief { padding-top: var(--s5); }
.brief > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 0 var(--s2); align-items: baseline;
  padding-bottom: var(--s2); border-bottom: 1px solid var(--rule-strong); }
.brief > summary h3 { font-size: var(--h-group); display: inline; }
.brief > summary .mono { color: var(--ink-muted); }
.brief .prose { max-width: 68ch; padding-top: var(--s3); }
.brief .prose p { margin: 0 0 var(--s3); white-space: pre-line; }

.summary a.rm-link { font-weight: 400; font-family: var(--mono); font-size: var(--meta); color: var(--ink-muted); }

.rm-head { max-width: 68ch; padding-top: var(--s3); }
.rm-head p { margin: 0 0 var(--s2); font-size: var(--small); overflow-wrap: anywhere; }
.rm-head .label, .changes-h { font-family: var(--mono); font-size: var(--meta); color: var(--ink-muted); }
.rm-head .source { font-family: var(--mono); font-size: var(--meta); color: var(--ink-muted); }
.step.lvl2 > details > summary .body, .step.lvl2 > details > .more { padding-left: var(--s4); }
.step.lvl3 > details > summary .body, .step.lvl3 > details > .more { padding-left: var(--s6); }
.step.lvl2 > details > .more, .step.lvl3 > details > .more { margin-left: calc(var(--margin) + var(--s3)); }
.rm-head .written { white-space: nowrap; }
.step.lvl1 > details > summary .need { font-weight: 600; }
.step.quiet > details > summary .need { color: var(--ink-muted); }
.step.dropped > details > summary .need { text-decoration: line-through; }
.stamp.live { color: var(--ink); }
.step .more p { font-size: var(--small); max-width: 68ch; overflow-wrap: anywhere; }
.step .more p.changes-h { margin: var(--s3) 0 var(--s1); font-size: var(--meta); }
ol.changes { list-style: none; margin: 0; padding: 0; max-width: 68ch; }
ol.changes li { padding: var(--s1) 0; border-top: 1px solid var(--rule); }
ol.changes .meta { margin-top: 0; }
ol.changes .text { display: block; font-size: var(--small); overflow-wrap: anywhere; }

.notice { margin: var(--s6) 0 0; color: var(--ink-muted); font-style: italic; }

@media (min-width: 48rem) {
  body { padding-top: var(--s7); }
  :root { --margin: 6rem; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Ledger</h1>
    <p class="fresh" id="fresh">Reading the ledger…</p>
    <p class="window" id="window" hidden></p>
    <ul class="summary" id="summary"></ul>
  </header>
  <div id="ledger" aria-live="polite"></div>
</main>
<script>
"use strict";
(function () {
  const DAY = 864e5, RECENT = 7 * DAY;
  const opened = new Set();       // ids of the disclosures the reader opened, kept across re-renders
  let ledger = null, conn = "connecting", lastError = "";

  // The page's own words, per language; the ledger's `lang` picks one by its primary subtag, English otherwise.
  const WORDS = {
    en: {
      ledger: "Ledger", reading: "Reading the ledger…",
      types: { decide: "decide", judge: "judge", act: "act", answer: "answer", other: "other" },
      status: { pending: "pending", answered: "answered", unverified: "answered (unverified)", done: "done",
        overtaken: "overtaken" },
      blocking: "blocking", optional: "optional", unseen: "● unseen", fresh: "new", work: "work", stalled: "stalled",
      waitsOn: x => "waits on " + x, whyYou: "why you",
      f: { session: "session", type: "type", raised: "raised", status: "status", sessions: "sessions",
        started: "started", finished: "finished", waitsOn: "waits on", refs: "refs" },
      needs: "Needs you", noNeeds: name => "Nothing needs you in " + name + ".",
      blockingH: "Blocking", blockingWhy: "work waits on you", optionalH: "Optional", optionalWhy: "asked, not waited on",
      answered: "Answered", answeredNote: "In the sessions' hands.",
      doing: "Work in progress", noDoing: "Nothing in progress.",
      done: "Done", doneCount: (n, older) => n + (older ? " in 7 days" : ""),
      noRecent: "Nothing in the last 7 days.", noDone: "Nothing done yet.", older: n => "older (" + n + ")",
      brief: "Brief", written: (w, since) => "written " + w + (since ? ", from " + since : ""),
      updated: (c, a) => "updated " + c + " · " + a + " · ", noUpdate: "no update yet · ",
      conn: { live: "live", connecting: "connecting", reconnecting: "reconnecting" },
      unreachable: "can't reach the Mac, showing what it last sent",
      covering: (a, b) => "covering " + a + " – " + b,
      notice: "No update yet. Ask the manager session for an update; this page shows the ledger as each update leaves it.",
      count: { blocking: n => n + " blocking", optional: n => n + " optional", answered: n => n + " answered" },
      titleBlocking: "Ledger · blocking",
      ago: { now: "just now", min: m => m + " min ago", h: h => h + " h ago", days: d => d + " days ago" },
      roadmap: "Roadmap", rmCount: (done, all) => done + " of " + all + " done",
      rmStatus: { "done": "done", "in progress": "in progress", "waiting": "waiting", "not started": "not started",
        "deferred": "deferred", "dropped": "dropped" },
      rf: { summary: "what it is", now: "now", waitsOn: "waits on", changes: "changes", owner: "owner", refs: "refs" },
      purpose: "purpose", doneWhen: "done when", newChanges: n => n + " new", freshChange: "new",
    },
    ko: {
      ledger: "장부", reading: "장부를 읽는 중…",
      types: { decide: "결정", judge: "판단", act: "조치", answer: "답변", other: "기타" },
      status: { pending: "대기", answered: "답함", unverified: "답함(미확인)", done: "완료", overtaken: "넘어감" },
      blocking: "차단", optional: "선택", unseen: "● 안 봄", fresh: "새 항목", work: "작업", stalled: "멈춤",
      waitsOn: x => "대기 중: " + x, whyYou: "내가 필요한 이유",
      f: { session: "세션", type: "유형", raised: "제기", status: "상태", sessions: "세션", started: "시작",
        finished: "끝남", waitsOn: "대기 중", refs: "참조" },
      needs: "내 차례", noNeeds: name => name + "에서 내 차례인 일은 없어요.",
      blockingH: "차단", blockingWhy: "일이 나를 기다리는 중", optionalH: "선택", optionalWhy: "물었지만 기다리지는 않음",
      answered: "답한 것", answeredNote: "세션이 처리하는 중이에요.",
      doing: "진행 중", noDoing: "진행 중인 일이 없어요.",
      done: "완료", doneCount: (n, older) => (older ? "7일간 " : "") + n,
      noRecent: "최근 7일간 끝난 일이 없어요.", noDone: "아직 끝난 일이 없어요.", older: n => "이전 (" + n + ")",
      brief: "요약", written: (w, since) => w + " 작성" + (since ? ", " + since + "부터" : ""),
      updated: (c, a) => "업데이트 " + c + " · " + a + " · ", noUpdate: "아직 업데이트 없음 · ",
      conn: { live: "실시간", connecting: "연결 중", reconnecting: "다시 연결 중" },
      unreachable: "Mac에 연결할 수 없어 마지막으로 받은 내용을 보여주는 중",
      covering: (a, b) => "범위 " + a + " – " + b,
      notice: "아직 업데이트가 없어요. 관리자 세션에 업데이트를 요청하세요. 이 페이지는 업데이트마다 남은 장부를 보여줘요.",
      count: { blocking: n => "차단 " + n, optional: n => "선택 " + n, answered: n => "답함 " + n },
      titleBlocking: "장부 · 차단",
      ago: { now: "방금", min: m => m + "분 전", h: h => h + "시간 전", days: d => d + "일 전" },
      roadmap: "로드맵", rmCount: (done, all) => all + "개 중 " + done + "개 완료",
      rmStatus: { "done": "완료", "in progress": "진행 중", "waiting": "대기", "not started": "시작 전",
        "deferred": "연기", "dropped": "폐기" },
      rf: { summary: "무엇인가", now: "지금", waitsOn: "대기 중", changes: "변경 이력", owner: "담당", refs: "참조" },
      purpose: "목적", doneWhen: "완료 조건", newChanges: n => "새 변경 " + n, freshChange: "새",
    },
  };
  let T = WORDS.en, loc = "en";
  const REMEMBER = "ledger-lang";   // the last ledger's language, so the next load starts in it

  function speak(tag) {
    tag = typeof tag === "string" && tag ? tag : "en";
    T = WORDS[tag.split("-")[0].toLowerCase()] || WORDS.en;
    try { new Intl.DateTimeFormat(tag); loc = tag; } catch (e) { loc = "en"; }
    document.documentElement.lang = tag;
    document.getElementById("title").textContent = T.ledger;
  }
  function recall() { try { return window.localStorage.getItem(REMEMBER); } catch (e) { return null; } }
  function remember(tag) { try { window.localStorage.setItem(REMEMBER, tag); } catch (e) { /* not kept */ } }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function add(parent, ...kids) { for (const k of kids) if (k) parent.appendChild(k); return parent; }
  function put(parent, child) { parent.appendChild(child); return child; }
  function time(ts) { const t = ts ? Date.parse(ts) : NaN; return isNaN(t) ? null : new Date(t); }
  function clock(ts) {
    const d = time(ts);
    if (!d) return "";
    const hm = d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
    if (d.toDateString() === new Date().toDateString()) return hm;
    return d.toLocaleDateString(loc, { month: "short", day: "numeric" }) + " " + hm;
  }
  function ago(ts) {
    const d = time(ts);
    if (!d) return "";
    const m = Math.round((Date.now() - d.getTime()) / 60000);
    if (m < 1) return T.ago.now;
    if (m < 60) return T.ago.min(m);
    const h = Math.round(m / 60);
    if (h < 36) return T.ago.h(h);
    return T.ago.days(Math.round(h / 24));
  }
  function slug(name) { return "i-" + String(name).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-"); }
  function short(sid) { return sid ? String(sid).slice(0, 8) : ""; }

  // A disclosure whose open state survives a re-render.
  function disclosure(cls, id) {
    const d = el("details", cls);
    d.dataset.id = id;
    if (opened.has(id)) d.open = true;
    d.addEventListener("toggle", function () { if (d.open) opened.add(id); else opened.delete(id); });
    return d;
  }
  function field(dl, label, value) {
    if (!value) return;
    add(dl, el("dt", null, label), el("dd", null, value));
  }

  // ------------------------------------------------------------- an owner's item
  function statusWord(it) {
    if (it.status === "answered" && it.unverified) return T.status.unverified;
    return T.status[it.status] || it.status;
  }
  function typeWord(it) { return T.types[it.type] || it.type; }
  function yours(it, compact) {
    const d = disclosure("item" + (compact ? " row" : ""), it.id);
    const s = put(d, el("summary"));
    const margin = el("span", "margin");
    if (compact) add(margin, el("span", null, clock(it.status_at || it.changed)));
    else add(margin, el("span", null, clock(it.raised)), el("span", "type", typeWord(it)));
    const body = el("span", "body");
    add(body, el("span", "need", it.need));
    const meta = el("span", "meta");
    add(meta, el("span", null, it.member));
    if (compact) {
      add(meta, el("span", "stamp", statusWord(it)));
    } else if (it.status === "pending") {
      add(meta, el("span", "stamp" + (it.blocking ? " blocking" : ""), it.blocking ? T.blocking : T.optional));
      if (!it.seen) add(meta, el("span", "mark", T.unseen));
    } else {
      add(meta, el("span", "stamp", statusWord(it)), el("span", null, clock(it.status_at)));
    }
    if (ledger && it.reported && it.reported === ledger.updated) add(meta, el("span", "mark", T.fresh));
    add(body, meta);
    add(s, margin, body);

    const more = put(d, el("div", "more"));
    if (it.why) add(more, add(el("p"), el("span", "label", T.whyYou + "  "), document.createTextNode(it.why)));
    if (it.source) add(more, el("blockquote", null, it.source));
    if (it.evidence && it.status !== "pending") {
      add(more, el("p", "label", statusWord(it) + (it.status_at ? " · " + clock(it.status_at) : "")));
      add(more, el("blockquote", null, it.evidence));
    }
    const dl = put(more, el("dl"));
    field(dl, T.f.session, it.member + (it.session ? " · " + short(it.session) : ""));
    field(dl, T.f.type, typeWord(it) + ", " + (it.blocking ? T.blocking : T.optional));
    field(dl, T.f.raised, clock(it.raised));
    field(dl, T.f.status, statusWord(it) + (it.status_at ? " · " + clock(it.status_at) : ""));
    return d;
  }

  // ------------------------------------------------------------- a work outcome
  function work(it, compact) {
    const d = disclosure("item" + (compact ? " row" : ""), it.id);
    const s = put(d, el("summary"));
    const margin = el("span", "margin");
    if (compact) add(margin, el("span", null, clock(it.finished || it.changed)));
    else add(margin, el("span", null, clock(it.started)), el("span", "type", it.status === "stalled" ? T.stalled : T.work));
    const body = el("span", "body");
    add(body, el("span", "need", it.title));
    if (compact) {
      add(body, add(el("span", "meta"), el("span", "stamp", T.status.done)));
    } else {
      add(body, el("span", "meaning", it.meaning));
      if (it.status === "stalled") add(body, add(el("span", "meta"), el("span", "mark", T.waitsOn(it.waits_on || "?"))));
      if (it.refs && it.refs.length) add(body, el("span", "refs", it.refs.join(" · ")));
    }
    add(s, margin, body);
    const more = put(d, el("div", "more"));
    if (compact && it.meaning) add(more, el("p", null, it.meaning));
    const dl = put(more, el("dl"));
    field(dl, T.f.sessions, (it.members || []).join(", "));
    field(dl, T.f.started, clock(it.started));
    field(dl, T.f.finished, clock(it.finished));
    if (it.status === "stalled") field(dl, T.f.waitsOn, it.waits_on);
    if (compact && it.refs && it.refs.length) field(dl, T.f.refs, it.refs.join(" · "));
    return d;
  }

  // ------------------------------------------------------------- the roadmap
  // Every part a compact row (id, title, status stamp, owner, its new changes), children indented beneath it;
  // a row expands to what the part is, what exists now, what it waits on, its refs and its changes, newest first.
  // A change is new when it is dated after the start of the span the last update covered.
  const QUIET = new Set(["done", "deferred", "dropped"]);
  function since() { return time(ledger && ledger.window && ledger.window.since); }
  function isNew(c, from) { const d = time(c.at); return !!(from && d && d > from); }
  function newCount(p, from) { return (p.changes || []).filter(c => isNew(c, from)).length; }
  function walk(parts, f) { for (const p of parts || []) { f(p); walk(p.parts, f); } }
  function labelled(label, text) {
    return add(el("p"), el("span", "label", label + "  "), document.createTextNode(text));
  }

  function step(ini, p, from, depth) {
    const box = el("div", "step lvl" + depth + (QUIET.has(p.status) ? " quiet" : "") +
      (p.status === "dropped" ? " dropped" : ""));
    const d = put(box, disclosure("item row", "rm-" + ini.name + "-" + p.id));
    const s = put(d, el("summary"));
    const body = el("span", "body");
    add(body, el("span", "need", p.title));
    const meta = put(body, el("span", "meta"));
    add(meta, el("span", "stamp" + (QUIET.has(p.status) ? "" : " live"), T.rmStatus[p.status] || p.status));
    if (p.owner) add(meta, el("span", null, p.owner));
    const n = newCount(p, from);
    if (n) add(meta, el("span", "mark", T.newChanges(n)));
    add(s, add(el("span", "margin"), el("span", "type", p.id)), body);

    const more = put(d, el("div", "more"));
    if (p.summary) add(more, labelled(T.rf.summary, p.summary));
    if (p.now) add(more, labelled(T.rf.now, p.now));
    if (p.waits_on) add(more, labelled(T.rf.waitsOn, p.waits_on));
    const dl = put(more, el("dl"));
    field(dl, T.rf.owner, p.owner);
    field(dl, T.rf.refs, (p.refs || []).join(" · "));
    const changes = (p.changes || []).slice().sort((a, b) => (time(b.at) || 0) - (time(a.at) || 0));
    if (changes.length) {
      add(more, el("p", "label changes-h", T.rf.changes));
      const ol = put(more, el("ol", "changes"));
      for (const c of changes) {
        const li = put(ol, el("li"));
        const m = put(li, el("span", "meta"));
        add(m, el("span", null, clock(c.at)));
        if (isNew(c, from)) add(m, el("span", "mark", T.freshChange));
        add(li, el("span", "text", c.text));
      }
    }
    if (p.parts && p.parts.length) {
      const kids = put(box, el("div", "steps"));
      p.parts.forEach(k => add(kids, step(ini, k, from, depth + 1)));
    }
    return box;
  }

  function roadmap(ini) {
    const r = ini.roadmap, from = since();
    let done = 0, all = 0, fresh = 0;
    walk(r.parts, p => { if (p.status !== "dropped") all++; if (p.status === "done") done++; fresh += newCount(p, from); });
    const sec = part(T.roadmap, T.rmCount(done, all));
    sec.classList.add("roadmap");
    sec.id = slug(ini.name) + "-roadmap";
    const head = put(sec, el("div", "rm-head"));
    if (r.purpose) add(head, labelled(T.purpose, r.purpose));
    if (r.done_when) add(head, labelled(T.doneWhen, r.done_when));
    add(head, add(el("p", "source", r.source + " · "), el("span", "written", T.written(clock(r.written), ""))));
    (r.parts || []).forEach(p => add(sec, step(ini, p, from, 1)));
    return { sec, fresh };
  }

  // ------------------------------------------------------------- one initiative
  function part(title, count) {
    const sec = el("section", "part");
    const h = put(sec, el("h3", null, title));
    if (count !== undefined) add(h, el("span", "count", count));
    return sec;
  }
  function doneAt(it) {
    const d = time(it.lane === "work" ? (it.finished || it.changed) : (it.status_at || it.changed));
    return d ? d.getTime() : 0;
  }

  function initiative(ini) {
    const items = ini.items || [];
    const pending = items.filter(i => i.lane === "yours" && i.status === "pending");
    const blocking = pending.filter(i => i.blocking), optional = pending.filter(i => !i.blocking);
    const answered = items.filter(i => i.lane === "yours" && i.status === "answered");
    const doing = items.filter(i => i.lane === "work" && i.status === "stalled")
      .concat(items.filter(i => i.lane === "work" && i.status === "in progress"));
    const done = items.filter(i => (i.lane === "yours" && (i.status === "done" || i.status === "overtaken"))
      || (i.lane === "work" && i.status === "done")).sort((a, b) => doneAt(b) - doneAt(a));
    const now = Date.now();
    const recent = done.filter(i => now - doneAt(i) <= RECENT), older = done.filter(i => now - doneAt(i) > RECENT);

    const sec = el("section", "initiative");
    sec.id = slug(ini.name);
    add(sec, el("h2", null, ini.name));

    const needs = put(sec, part(T.needs, pending.length));
    needs.classList.add("needs");
    if (!pending.length) add(needs, el("p", "empty", T.noNeeds(ini.name)));
    if (blocking.length) {
      const g = put(needs, el("div", "group blocking"));
      add(put(g, el("h4", null, T.blockingH)), el("span", "why", T.blockingWhy));
      blocking.forEach(i => add(g, yours(i)));
    }
    if (optional.length) {
      const g = put(needs, el("div", "group"));
      add(put(g, el("h4", null, T.optionalH)), el("span", "why", T.optionalWhy));
      optional.forEach(i => add(g, yours(i)));
    }
    const rm = ini.roadmap && ini.roadmap.parts ? roadmap(ini) : null;
    if (rm) add(sec, rm.sec);
    if (answered.length) {
      const a = put(sec, part(T.answered, answered.length));
      add(a, el("p", "empty", T.answeredNote));
      answered.forEach(i => add(a, yours(i)));
    }
    const w = put(sec, part(T.doing, doing.length));
    if (!doing.length) add(w, el("p", "empty", T.noDoing));
    doing.forEach(i => add(w, work(i)));

    const dn = put(sec, part(T.done, T.doneCount(recent.length, older.length > 0)));
    if (!recent.length) add(dn, el("p", "empty", older.length ? T.noRecent : T.noDone));
    recent.forEach(i => add(dn, i.lane === "work" ? work(i, true) : yours(i, true)));
    if (older.length) {
      const f = put(dn, disclosure("fold", "older-" + ini.name));
      add(f, el("summary", null, T.older(older.length)));
      older.forEach(i => add(f, i.lane === "work" ? work(i, true) : yours(i, true)));
    }

    const b = ini.brief;
    if (b && b.text) {
      const br = put(sec, disclosure("brief", "brief-" + ini.name));
      const s = put(br, el("summary"));
      add(s, el("h3", null, T.brief), el("span", "mono", T.written(clock(b.written), b.since ? clock(b.since) : "")));
      const prose = put(br, el("div", "prose"));
      String(b.text).split(/\n\s*\n/).forEach(p => add(prose, el("p", null, p.trim())));
    }
    return { sec, blocking: blocking.length, optional: optional.length, answered: answered.length, roadmap: rm };
  }

  // ------------------------------------------------------------- the page
  function header() {
    const fresh = document.getElementById("fresh"), win = document.getElementById("window");
    fresh.textContent = "";
    const state = conn === "live" ? T.conn.live : conn === "connecting" ? T.conn.connecting : T.conn.reconnecting;
    if (ledger && ledger.updated) {
      add(fresh, document.createTextNode(T.updated(clock(ledger.updated), ago(ledger.updated))));
    } else if (ledger) {
      add(fresh, document.createTextNode(T.noUpdate));
    }
    add(fresh, el("span", "conn", lastError ? T.unreachable : state));
    const w = ledger && ledger.window;
    win.hidden = !(w && w.since);
    if (w && w.since) win.textContent = T.covering(clock(w.since), clock(w.until));
  }

  function render() {
    header();
    if (!ledger) return;
    const root = document.getElementById("ledger"), summary = document.getElementById("summary");
    const y = window.scrollY;
    root.textContent = "";
    summary.textContent = "";
    const inits = ledger.initiatives || [];
    if (!inits.length) {
      add(root, el("p", "notice", T.notice));
    }
    for (const ini of inits) {
      const r = initiative(ini);
      add(root, r.sec);
      const li = put(summary, el("li"));
      const a = put(li, el("a", null, ini.name));
      a.href = "#" + r.sec.id;
      if (r.blocking) add(li, el("span", "count blocking", T.count.blocking(r.blocking)));
      add(li, el("span", "count", T.count.optional(r.optional)));
      if (r.answered) add(li, el("span", "count", T.count.answered(r.answered)));
      if (r.roadmap) {
        const ra = put(li, el("a", "rm-link", T.roadmap));
        ra.href = "#" + r.roadmap.sec.id;
        if (r.roadmap.fresh) add(li, el("span", "count", T.newChanges(r.roadmap.fresh)));
      }
    }
    document.title = (inits.reduce((n, i) => n + (i.items || []).filter(x => x.lane === "yours" && x.status === "pending" && x.blocking).length, 0) || "") ? T.titleBlocking : T.ledger;
    window.scrollTo(0, y);
  }

  // One fetch at a time; a request for a fresh ledger while one is in flight (an update that landed after it
  // was sent) is kept and fetched as soon as the current one settles, so the last update is always shown.
  let loading = null, again = false;
  function load() {
    if (loading) { again = true; return loading; }
    loading = fetch("ledger.json", { cache: "no-store", credentials: "same-origin" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(j => { ledger = j; lastError = ""; speak(j.lang); remember(j.lang || "en"); render(); })
      .catch(e => { lastError = String(e && e.message || e); render(); })
      .finally(() => { loading = null; if (again) { again = false; load(); } });
    return loading;
  }

  function listen() {
    const es = new EventSource("events");
    es.onopen = function () { conn = "live"; load(); };
    es.addEventListener("changed", function () { load(); });
    es.onerror = function () { conn = "reconnecting"; header(); };
  }

  speak(recall());
  document.getElementById("fresh").textContent = T.reading;
  load();
  listen();
  setInterval(header, 30000);
})();
</script>
</body>
</html>
